appId: fr.jerome.claudeterm
productName: ClaudeTerm
copyright: PolyForm Noncommercial 1.0.0
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/themes
    to: themes
  - from: resources/plugins
    to: plugins
  - from: resources/plugin-host
    to: plugin-host
asarUnpack:
  - "**/node_modules/node-pty/**"
  # ripgrep runs as a program: it cannot live inside the asar
  - "**/node_modules/@vscode/ripgrep-*/**"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # the zip is what the in-app updater downloads (latest-mac.yml)
    - target: zip
      arch: [arm64, x64]
  # ad-hoc signature (no certificate): a modified bundle with a broken seal shows "damaged" with no way to open it;
  # ad-hoc signed, Gatekeeper offers "Open Anyway" (System Settings › Privacy & Security) like any unsigned app
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSMinimumSystemVersion: "12.0"
dmg:
  title: ClaudeTerm
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  language: 1036
linux:
  target: [AppImage]
  category: Development
npmRebuild: true
# releases on GitHub: installers + latest*.yml read by the in-app updater (src/main/services/updater.ts)
publish:
  provider: github
  owner: sunstan
  repo: claude-term
  # CI publishes the draft once every platform is built
  releaseType: draft
