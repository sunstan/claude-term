name: release
# Every push to main (docs aside) publishes a release: version = latest v* tag + 1 patch, or package.json's version
# when it is higher (raise it for a minor / major). Builds upload into a draft that is published only when the three
# platforms succeed, so the in-app updater (releases/latest) never sees a partial release. Nothing is committed back.
# workflow_dispatch: build only (artifacts kept), or publish when asked.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE.md']
  workflow_dispatch:
    inputs:
      publish: { description: 'Publish a release', type: boolean, default: false }
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          echo "version=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"
          echo "publish=${{ github.event_name == 'push' || inputs.publish }}" >> "$GITHUB_OUTPUT"
      - name: draft release (a leftover draft of a failed run is replaced)
        if: steps.v.outputs.publish == 'true'
        run: |
          V=v${{ steps.v.outputs.version }}
          if gh release view "$V" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then gh release delete "$V" --yes; fi
          gh release create "$V" --draft --target "$GITHUB_SHA" --title "ClaudeTerm ${V#v}" --generate-notes
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            script: dist:mac-all
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # dist:mac-all also builds Intel on an Apple silicon runner, where npm installs only the arm64 ripgrep
      - if: runner.os == 'macOS'
        run: |
          V=$(node -p "require('./node_modules/@vscode/ripgrep/package.json').version")
          for a in arm64 x64; do
            d=node_modules/@vscode/ripgrep-darwin-$a
            [ -d "$d" ] && continue
            mkdir -p "$d" && tar -xzf "$(npm pack @vscode/ripgrep-darwin-$a@$V --silent)" -C "$d" --strip-components=1 && chmod +x "$d/bin/rg"
          done
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish ${{ needs.version.outputs.publish == 'true' && 'always' || 'never' }} --config.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # the renderer bundle (Monaco) needs more than the default heap
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        with:
          name: claudeterm-${{ needs.version.outputs.version }}-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "v${{ needs.version.outputs.version }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
